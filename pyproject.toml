[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrymr"
version = "0.1.0.dev0"
description = "Discord-native community security and incident-response sentinel"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "amiencoy" }]
dependencies = [
  "discord.py>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
scrymr = "scrymr.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrymr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
